name: PS5 Virtual - RPCSX + Tailscale OAuth + RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-virtual-build
  cancel-in-progress: false

jobs:
  ps5-virtual:
    name: Build Emulator and Remote Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install Desktop, RDP and Build Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            g++-14 \
            libunwind-dev \
            libsox-dev \
            libasound2-dev \
            nasm \
            libglfw3-dev \
            libvulkan-dev \
            vulkan-validationlayers \
            mesa-utils \
            vulkan-tools \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            openssl \
            curl \
            ca-certificates \
            pciutils \
            x11-xserver-utils \
            python3 \
            iptables

      - name: Check Runner Sudo and TUN Support
        shell: bash
        run: |
          set -euo pipefail
          echo "===== RUNNER IDENTITY ====="
          id
          echo "===== SUDO CHECK ====="
          if ! sudo -n true; then
            echo "::error::Sudo is not available on this runner."
            exit 1
          fi
          sudo -n true
          echo "Sudo check passed."
          echo "===== TUN DEVICE ====="
          if [ -e /dev/net/tun ]; then
            ls -l /dev/net/tun
          else
            echo "/dev/net/tun is not present before Tailscale setup."
            echo "The Tailscale action must initialize networking."
          fi
          echo "===== NETWORK TOOLS ====="
          command -v ip
          command -v iptables

      - name: Validate Tailscale OAuth Secrets
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$TS_CLIENT_ID" ]; then
            echo "::error::Missing repository secret TS_OAUTH_CLIENT_ID."
            exit 1
          fi
          if [ -z "$TS_CLIENT_SECRET" ]; then
            echo "::error::Missing repository secret TS_OAUTH_SECRET."
            exit 1
          fi
          case "$TS_CLIENT_SECRET" in
            tskey-client-*) echo "Secret format OK." ;;
            *)
              echo "::error::TS_OAUTH_SECRET does not start with tskey-client-. Wrong key type."
              exit 1
              ;;
          esac
          if printf '%s' "$TS_CLIENT_SECRET$TS_CLIENT_ID" | grep -q '[[:space:]]'; then
            echo "::error::Whitespace or newline found in one of the OAuth secrets."
            exit 1
          fi
          echo "Testing OAuth credentials against the Tailscale API..."
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -d "client_id=$TS_CLIENT_ID" \
            -d "client_secret=$TS_CLIENT_SECRET" \
            -d "grant_type=client_credentials" \
            https://api.tailscale.com/api/v2/oauth/token || true)"
          echo "Tailscale OAuth token endpoint returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Tailscale rejected the OAuth client (HTTP $HTTP_CODE). Check that Client ID and Secret are from the same OAuth client, that it is not revoked, and that it has Auth Keys: Write scope with tag:ci."
            exit 1
          fi
          echo "OAuth secrets are present."

      - name: Connect Tailscale Using OAuth
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          use-cache: "false"
          log-mode: normal

      - name: Verify Tailscale
        shell: bash
        run: |
          set -euo pipefail
          echo "===== TAILSCALE STATUS ====="
          tailscale status
          TS_IP="$(tailscale ip -4 | head -n 1)"
          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale did not obtain an IPv4 address."
            tailscale status || true
            exit 1
          fi
          echo "Tailscale IPv4: $TS_IP"
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "===== NETWORK INTERFACE ====="
          ip address show tailscale0 || true

      - name: Generate Random RDP Password
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_CODE="$(openssl rand -hex 12)"
          echo "::add-mask::$ACCESS_CODE"
          if ! id ps5remote >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash ps5remote
          fi
          printf '%s:%s\n' ps5remote "$ACCESS_CODE" \
            | sudo chpasswd
          echo "RDP_USER=ps5remote" >> "$GITHUB_ENV"
          echo "RDP_PASSWORD=$ACCESS_CODE" >> "$GITHUB_ENV"
          echo "RDP credentials generated."

      - name: Configure XFCE Desktop
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d \
            -o ps5remote \
            -g ps5remote \
            /home/ps5remote
          sudo tee /home/ps5remote/.xsession >/dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset SESSION_MANAGER
          exec startxfce4
          EOF
          sudo chmod 700 /home/ps5remote/.xsession
          sudo chown ps5remote:ps5remote \
            /home/ps5remote/.xsession
          sudo adduser xrdp ssl-cert || true
          echo "XFCE desktop configured."

      - name: Configure RDP on Tailscale Interface
        shell: bash
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"
          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale IP is unavailable."
            exit 1
          fi
          sudo python3 - "$TS_IP" <<'PY'
          import sys
          from pathlib import Path
          path = Path("/etc/xrdp/xrdp.ini")
          lines = path.read_text().splitlines()
          output = []
          in_globals = False
          found_globals = False
          found_address = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  if in_globals and not found_address:
                      output.append("address=" + sys.argv[1])
                      found_address = True
                  in_globals = stripped.lower() == "[globals]"
                  found_globals = found_globals or in_globals
                  output.append(line)
                  continue
              if in_globals and stripped.lower().startswith("address="):
                  output.append("address=" + sys.argv[1])
                  found_address = True
              else:
                  output.append(line)
          if not found_globals:
              raise SystemExit("XRDP [Globals] section not found")
          if in_globals and not found_address:
              output.append("address=" + sys.argv[1])
              found_address = True
          if not found_address:
              raise SystemExit("XRDP address could not be configured")
          path.write_text("\n".join(output) + "\n")
          PY
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp-sesman || true
          sudo systemctl restart xrdp
          echo "RDP configured for Tailscale IP $TS_IP"

      - name: Publish Private Session Details
        shell: bash
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"
          {
            echo "## Remote Desktop Session"
            echo
            echo "- Tailscale IP: $TS_IP"
            echo "- Port: 3389"
            echo "- Username: ps5remote"
            echo "- Password: $RDP_PASSWORD"
            echo
            echo "Keep these credentials private."
            echo "The session ends when the workflow stops."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show System Hardware
        shell: bash
        run: |
          set -euo pipefail
          echo "===== OPERATING SYSTEM ====="
          cat /etc/os-release
          echo "===== ARCHITECTURE ====="
          uname -m
          echo "===== CPU ====="
          lscpu
          echo "===== MEMORY ====="
          free -h
          echo "===== STORAGE ====="
          df -h
          echo "===== GRAPHICS DEVICES ====="
          lspci | grep -Ei 'vga|3d|display' || true
          echo "===== VULKAN ====="
          vulkaninfo --summary || true
          echo "===== TAILSCALE ====="
          tailscale status
          tailscale ip -4

      - name: Download RPCSX Source
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive \
            https://github.com/RPCSX/rpcsx.git rpcsx
          cd rpcsx
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../rpcsx-commit.txt

      - name: Configure RPCSX
        shell: bash
        run: |
          set -euo pipefail
          cd rpcsx
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Compile RPCSX
        shell: bash
        run: |
          set -euo pipefail
          cd rpcsx
          cmake --build build --parallel 2
          echo "===== EXECUTABLE FILES ====="
          find build -type f -executable -print

      - name: Verify Remote Desktop and Network
        if: always()
        shell: bash
        run: |
          echo "===== XRDP STATUS ====="
          sudo systemctl status xrdp --no-pager || true
          echo "===== XRDP SESSION MANAGER ====="
          sudo systemctl status xrdp-sesman --no-pager || true
          echo "===== LISTENING PORTS ====="
          sudo ss -lntp | grep ':3389' || true
          echo "===== TAILSCALE SERVICE ====="
          sudo systemctl status tailscaled --no-pager || true
          echo "===== TAILSCALE STATUS ====="
          tailscale status || true
          tailscale ip -4 || true
          echo "===== NETWORK INTERFACE ====="
          ip address show tailscale0 || true

      - name: Collect Build Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-report
          {
            echo "PS5 Virtual Build Report"
            date -u
            uname -a
            lscpu
            free -h
            df -h
          } > build-report/system.txt
          if [ -f rpcsx-commit.txt ]; then
            cp rpcsx-commit.txt build-report/
          fi
          if [ -d rpcsx/build ]; then
            find rpcsx/build -type f -executable \
              -print > build-report/executables.txt || true
          fi
          if [ -f rpcsx/build/CMakeCache.txt ]; then
            cp rpcsx/build/CMakeCache.txt build-report/
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-virtual-rpcsx-build
          path: |
            rpcsx/build/
            rpcsx-commit.txt
            build-report/
          if-no-files-found: warn
          retention-days: 3
